[project]
name = "attest"
version = "0.1.0"
description = "Autonomous compliance agent that sweeps a live AWS account, cites its evidence, and remediates only with human approval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

# Pinned at install time on 2026-09-01. See BUILD_LOG.md for the resolution notes.
dependencies = [
    "strands-agents==1.54.0",
    "strands-agents-tools==0.8.7",
    "boto3==1.43.83",
    "botocore==1.43.83",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "moto==5.2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "tools", "tools.evidence", "tools.remediation", "api", "packet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real AWS; skipped without credentials",
    "bedrock: requires Bedrock model access",
]
